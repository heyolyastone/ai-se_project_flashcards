<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Olga Sycheva" />
    <meta
      name="description"
      content="A flashcard app for creating study decks and learning materials."
    />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials, education, cards"
    />

    <title>Flash Cards</title>

    <link rel="icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />

    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <script type="module" src="./assets/js/index.js"></script>
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">Flash Cards</a>
      </h1>

      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a href="#home" class="nav__link">My Decks</a>
          </li>
          <li>
            <a href="#home" class="nav__link">Study</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section class="decks" id="home">
        <h2 class="decks__title">My Decks</h2>

        <div class="decks__content">
          <ul class="decks__list"></ul>

          <template id="deck-template">
            <li class="deck deck_color_green">
              <a class="deck__link" href="#"></a>
              <h3 class="deck__title"></h3>
              <div class="deck__row">
                <p class="deck__count"></p>
                <button
                  class="deck__delete-btn"
                  type="button"
                  aria-label="Delete this deck"
                ></button>
              </div>
            </li>
          </template>

          <button class="decks__new-deck-btn" type="button">+ New Deck</button>
        </div>
      </section>

      <section class="carousel" id="carousel1">
        <h2 class="carousel__title"></h2>

        <div class="carousel__content">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
          ></button>

          <div class="carousel__card carousel__card_color_green">
            <p class="carousel__card-text"></p>
          </div>

          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
        </div>

        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Flip card"
        ></button>
      </section>

      <section class="not-found" id="not-found">
        <h2 class="not-found__title">404</h2>
        <p class="not-found__text">Page not found</p>
        <a href="#home" class="not-found__link">Go back home</a>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">&copy; 2026 Flash Cards</p>
    </footer>
  </body>
</html>
